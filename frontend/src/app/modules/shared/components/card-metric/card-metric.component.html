<mat-card class="metric-card-container">
  <mat-card-title>
    <p class="text-center">{{headerLabelKey}}</p>
  </mat-card-title>
  <mat-card-content>
    <p class="text-2xl p-2.5 text-center">{{(value | number) | abbreviateNumber}}
      @if (value >= 1000000 && value <= 99999999) {
        <span class="text-2xl">{{ 'pageDashboard.million' | i18n : { ns: 'page.dashboard' } }}</span>
      }</p>
    </mat-card-content>
  </mat-card>
